[project]
name = "lit-agent-min"
version = "0.1.0"
description = "Phase 0 prototype — 多智能体文献研究助手的最小可复用内核（可部分升级到 Phase 1）"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyalex>=0.15",
  "arxiv>=2.1",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "qdrant-client>=1.9",
  "kuzu>=0.6",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "tiktoken>=0.7",
  "litellm>=1.50",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "respx>=0.21",
]

[tool.uv]
# Phase 0 原型：不把本项目装进 venv。
# 原因：工作区路径含非 ASCII（E:\大学\...），可编辑安装会生成带该路径的 .pth，
# 中文版 Windows 的 site.py 以 GBK 读取该 UTF-8 文件 → UnicodeDecodeError。
# Phase 1 建立正式仓库（ASCII 路径或显式 UTF-8 模式）时再开启打包：删除本节即可。
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lit_agent_min"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["lit_agent_min", "steps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # package=false 时让 tests/ 能 import lit_agent_min
asyncio_mode = "auto"
addopts = "-q"
