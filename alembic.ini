[alembic]
script_location = migrations
prepend_sys_path = .
# URL is resolved by migrations/env.py (settings -> env var -> config file).
# Left empty on purpose so a wrong default can never point at a foreign database.
# NOTE: keep this file ASCII-only -- alembic reads it with the *locale* codec
# (GBK on zh-CN Windows) and non-ASCII bytes raise UnicodeDecodeError.
sqlalchemy.url =
version_path_separator = os
path_separator = os
