# Phase 1 配置模板（复制为 config/config.yaml 后按本机修改）
# 约定：
# - 所有键都有安全默认，空配置也能启动（`lit-agent doctor` 会验证）；
# - 密钥只从环境变量读，不写进本文件（见 .env.example）；
# - storage.data_root 设为**纯 ASCII 绝对路径**时，下列 data/... 相对路径会重挂到该根下
#   （Windows 上 Kuzu 无法打开含中文的路径，见 ADR-0003）。

storage:
  data_root: ""                 # 例：D:/lit-agent-store/data（本项目本机已如此配置）
  sqlite_path: data/app.db
  kuzu_path: data/kuzu          # Kuzu 是单文件数据库
  qdrant_path: data/qdrant      # Qdrant local 是目录
  papers_dir: data/papers
  checkpoint_path: data/checkpoints.db

sources:
  openalex:
    mailto: ""                  # 礼貌池邮箱（建议填真实联系邮箱）
    per_page: 200
    timeout_s: 30.0
    max_retries: 3
  arxiv:
    categories: [cs.AI, cs.CL, cs.LG]
  venues: []                    # 白名单候选名称；Step 1.6 解析为 OpenAlex source.id

providers:
  cloud:
    name: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    timeout_s: 60.0
    max_retries: 2
    max_tokens: 4096
    cache_enabled: true
  local:
    engine: ollama
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b
    ctx_len: 8192

routing:
  sensitivity: strict           # strict | balanced | off
  complexity_threshold: 0.5
  run_cost_budget_usd: 2.0

guards:
  scope_cosine_min: 0.60        # embedding 口径；换模型后须重标定（F9）
  oos_share_max: 0.30
  loop_k: 5
  no_progress_steps: 2
  max_retries: 2

scheduler:
  enabled: false                # Phase 1 只装配不注册（P4 才实跑周更）
  timezone: Asia/Singapore
  default_cron: "0 3 * * 1"
  stagger_seconds: 300

eval:
  enabled: true
  judge_provider: cloud
  sample_rate: 0.2

vector:                          # ADR-0004
  model_id: BAAI/bge-m3
  model_rev: ""                  # 建议填模型 commit 短哈希以锁定可复现
  dim: 1024                      # 与 guide §2.6 冻结契约一致，改动需 ADR
  batch_size: 32
  num_threads: 8
  hf_home: data/models
  active_collection: papers_v1

logging:
  level: INFO
  format: json
  app_log: logs/app.jsonl
  error_log: logs/errors.jsonl
  console: true
  max_field_chars: 500
  strict_contracts: true
  max_bytes: 104857600
  backup_count: 30
  debug_days: 7
